#
# DRAFT: not active until the repository is published on GitLab. See
# docs/release.md. Images are pinned by digest. The release tools run as
# job images (no Docker-in-Docker: its daemon cannot see the job's files).
#
# Assumptions: v* tags are protected; SIGN and REQUIRE_SIGNATURE are
# protected project variables; the docker-host runner only takes jobs of
# protected refs and is dedicated (or ephemeral): Docker access is root on
# its host.

stages: [test, integration, build, sbom, sign]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GOTOOLCHAIN: go1.27.3
  GO_IMAGE: golang:1.27.3@sha256:e519d3b0a5b285e5aa53ab9eef02bc6bbb9cb04608389b743a136a9ce75f0d1e
  RELEASE_TAG: /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/

test:
  stage: test
  image: $GO_IMAGE
  script:
    - test -z "$(gofmt -l .)"
    - make vet
    - make test
    - make cover
    - make reproducible VERSION=v0.0.0-ci

# Starts containers and reaches them on 127.0.0.1: a shell runner with
# Docker, for protected refs only (never the code of a merge request).
integration:
  stage: integration
  tags: [docker-host]
  script:
    - make integration
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $DOCKER_HOST_RUNNER == "true"

build:
  stage: build
  image: $GO_IMAGE
  variables:
    VERSION: $CI_COMMIT_TAG
  script:
    - '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag"; exit 1; }'
    - make release-check binaries SIGN="${SIGN:-none}" REQUIRE_SIGNATURE="${REQUIRE_SIGNATURE:-1}"
  artifacts:
    paths: [dist/]
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG

sbom:
  stage: sbom
  image:
    # The debug variant has a shell (busybox).
    name: docker.io/anchore/syft:v1.57.0-debug@sha256:b4bb1b42287176252af950fe601bda412ec66dd1ad56762735508eddb0e79dfa
    entrypoint: [""]
  variables:
    SYFT_CHECK_FOR_APP_UPDATE: "false"
  script:
    # Same commands as the Makefile sbom and checksums targets.
    - |
      for a in amd64 arm64; do
        f="dist/loch-lambda-runtime-linux-$a.cdx.json"
        /syft scan "file:dist/loch-lambda-runtime-linux-$a" -o "cyclonedx-json=$f"
        sed -E 's/"serialNumber":"[^"]*",?//; s/"timestamp":"[^"]*",?//' "$f" > dist/sbom.tmp && mv dist/sbom.tmp "$f"
        ! grep -Eq '"(serialNumber|timestamp)"' "$f"
      done
      cd dist && LC_ALL=C sha256sum loch-lambda-runtime-linux-amd64 loch-lambda-runtime-linux-amd64.cdx.json \
        loch-lambda-runtime-linux-arm64 loch-lambda-runtime-linux-arm64.cdx.json > SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: never # release artifacts
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG

# Keyless signature, when the protected variable SIGN is cosign.
sign:
  stage: sign
  image:
    # The dev variant has a shell (busybox).
    name: ghcr.io/sigstore/cosign/cosign:v3.1.4-dev@sha256:8af1a2cf9fba903fdfc6bdafdc25f7b13ef34ad722095543ea787fb96f7240c1
    entrypoint: [""]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - (cd dist && sha256sum -c SHA256SUMS)
    - cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: never # release artifacts
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG && $SIGN == "cosign"
