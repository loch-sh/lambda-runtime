#
# CI and releases, on GitHub Actions. Actions are pinned by commit (the
# comment gives the version, Dependabot keeps them up to date), runners by
# version. See docs/release.md.

name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:

permissions:
  contents: read

# One run per branch or pull request: a new push cancels the previous one.
# Tags are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Unit tests (with -race) on both architectures the runtime ships for.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: make vet
      - run: make test
      - run: make cover

  # The release recipe, run twice from two copies: same sha256.
  reproducible:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make reproducible VERSION=v0.0.0-ci

  # The AWS images under Docker, on both architectures. Starts containers:
  # never for pull requests from forks.
  integration:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make integration

  # The release is split so that each job holds only what it needs: build
  # (read), attest and sign (OIDC token, in the protected "release"
  # environment), publish (write). The tag reaches the scripts through
  # VERSION only, validated before make, which never expands it.
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, reproducible, integration]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
      SIGN: ${{ vars.SIGN || 'none' }}
      REQUIRE_SIGNATURE: ${{ vars.REQUIRE_SIGNATURE || '1' }}
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - name: validate the tag and SIGN
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag"; exit 1; }
          # minisign needs the maintainer's key: never in CI.
          case "$SIGN" in none|cosign) ;; *) echo "SIGN must be none or cosign in CI"; exit 1;; esac
          if [ "$REQUIRE_SIGNATURE" = 1 ] && [ "$SIGN" = none ]; then
            echo "REQUIRE_SIGNATURE=1: set the repository variable SIGN to cosign"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, for the check below
      - name: the tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "the tag does not point to a commit of main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache from other runs in a release build
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
      - run: make release-check binaries sbom checksums SYFT="$SYFT_CMD" TOOL_DIST=dist
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # GitHub build provenance (verify with `gh attestation verify`) for every
  # file of SHA256SUMS, and the cosign keyless signature of SHA256SUMS when
  # the repository variable SIGN is "cosign".
  release-sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release # protect it with required reviewers
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - if: vars.SIGN == 'cosign'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - if: vars.SIGN == 'cosign'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - if: vars.SIGN == 'cosign'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/SHA256SUMS.cosign.bundle
          if-no-files-found: error

  release-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, release-sign]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      REQUIRE_SIGNATURE: ${{ vars.REQUIRE_SIGNATURE || '1' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - name: exactly the expected files, matching SHA256SUMS
        run: |
          cd dist && sha256sum -c SHA256SUMS
          expected="$(awk '{print $2}' SHA256SUMS; echo SHA256SUMS; [ -f SHA256SUMS.cosign.bundle ] && echo SHA256SUMS.cosign.bundle)"
          [ "$(ls -A | sort)" = "$(echo "$expected" | sort)" ] || { echo "unexpected files in dist/"; ls -A; exit 1; }
          if [ "$REQUIRE_SIGNATURE" = 1 ] && [ ! -f SHA256SUMS.cosign.bundle ]; then
            echo "REQUIRE_SIGNATURE=1 and no signature"; exit 1
          fi
      - if: vars.SIGN == 'cosign'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: the signature is this workflow's, for this tag
        if: vars.SIGN == 'cosign'
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
