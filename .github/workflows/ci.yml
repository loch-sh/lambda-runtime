#
# DRAFT: not active until the repository is published on GitHub. See
# docs/release.md. Actions are pinned by commit, runners by version.

name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.3

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: test -z "$(gofmt -l .)"
      - run: make vet
      - run: make test
      - run: make cover
      - run: make reproducible VERSION=v0.0.0-ci

  # Starts Docker containers: never for pull requests from forks.
  integration:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: make integration

  # The release is split so that each job holds one permission: build
  # (read), sign (OIDC token, in the protected "release" environment),
  # publish (write). The tag reaches the scripts through VERSION only,
  # validated before make, which never expands it.
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, integration]
    env:
      VERSION: ${{ github.ref_name }}
      SIGN: ${{ vars.SIGN || 'none' }}
      REQUIRE_SIGNATURE: ${{ vars.REQUIRE_SIGNATURE || '1' }}
    steps:
      - name: validate the tag
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: make release-check binaries sbom checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release-sign:
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGN == 'cosign'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-build
    environment: release # protect it with required reviewers
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: cd dist && sha256sum -c SHA256SUMS
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/dist":/dist -w /dist -e HOME=/tmp \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d \
            sign-blob --yes --bundle /dist/SHA256SUMS.cosign.bundle /dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/SHA256SUMS.cosign.bundle

  release-publish:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [release-build, release-sign]
    environment: release
    permissions:
      contents: write
    env:
      REQUIRE_SIGNATURE: ${{ vars.REQUIRE_SIGNATURE || '1' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - run: |
          cd dist && sha256sum -c SHA256SUMS
          if [ "$REQUIRE_SIGNATURE" = 1 ] && [ ! -f SHA256SUMS.cosign.bundle ]; then
            echo "REQUIRE_SIGNATURE=1 and no signature"; exit 1
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
